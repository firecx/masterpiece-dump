version: '3.8'

services:
  masterpiece-dump:
    build: ./frontend
    image: masterpiece-dump
    container_name: masterpiece-dump
    environment:
      VIRTUAL_HOST: masterpiece-dump.ru
      VIRTUAL_PORT: 80
    depends_on:
      - nginx-backend-masterpiece-dump
    ports:
      - "8090:80"
    networks:
      - proxy-network
    restart: unless-stopped
    
  php-backend-masterpiece-dump:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: php-backend-masterpiece-dump
    depends_on:
      - postgres
    networks:
      - network-masterpiece-dump
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=lib
      - DB_USER=user
      - DB_PASSWORD=user
    restart: unless-stopped

  nginx-backend-masterpiece-dump:
    image: nginx:1.29
    ports:
      - "8000:80"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/:/app:ro
    depends_on:
      - php-backend-masterpiece-dump
    networks:
      - network-masterpiece-dump
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_DB=lib
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=user
    volumes:
      - postgres-data-masterpiece-dump:/var/lib/postgresql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - network-masterpiece-dump
    restart: unless-stopped

volumes:
  postgres-data-masterpiece-dump:

networks:
  network-masterpiece-dump:
    driver: bridge
  proxy-network:
    external: true